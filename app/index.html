<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Hopf–Cole cosmology lab</title>
  <link rel="stylesheet" href="./css/hcc.css">
  <link rel="stylesheet" href="./css/lab.css">
</head>
<body class="hcc-page-body lab-body">
  <header class="lab-title" id="lab-title">
    <h1>Hopf–Cole cosmology lab</h1>
    <span class="lab-sub">LPT phase-space sheet vs. Hopf–Cole adhesion solution</span>
    <a class="lab-back" href="../index.html">← back to the book</a>
  </header>
  <div class="lab-shell">
    <aside class="lab-controls" id="lab-controls" aria-label="Controls"></aside>
    <main class="lab-main">
      <div class="lab-banner" id="lab-banner" role="alert" hidden></div>
      <div class="lab-vis hcc-controls" id="lab-vis"></div>
      <section id="sec-fields" class="lab-section"><h2>Fields</h2><div id="fields-host"></div></section>
      <section id="sec-spectra" class="lab-section"><h2>Spectra</h2><div id="spectra-host"></div></section>
      <section id="sec-legendre" class="lab-section" hidden><h2>Legendre lab</h2><div id="legendre-host"></div></section>
      <section id="sec-pdfs" class="lab-section" hidden><h2>PDFs</h2><div id="pdfs-host"></div></section>
      <section id="sec-kernels" class="lab-section" hidden><h2>Kernels</h2><div id="kernels-host"></div></section>
      <section id="sec-explain" class="lab-section"><h2>Explain</h2><div id="explain-host"></div></section>
    </main>
  </div>
  <footer class="lab-statusbar" id="lab-statusbar" role="status">
    <span class="lab-dot" id="lab-status-dot"></span>
    <span id="lab-status-text">starting …</span>
    <span class="lab-spacer"></span>
    <span id="lab-status-timing" class="lab-timing"></span>
    <span id="lab-status-backend" class="lab-backend" title="graphics backend and performance preset">…</span>
  </footer>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
