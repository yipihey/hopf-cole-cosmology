[package]
name = "hcc-core"
version = "0.1.0"
edition = "2021"
description = "Hopf-Cole / Burgers / nLPT cosmology numerical core (WASM)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustfft = "6.4"
num-complex = "0.4"
wasm-bindgen = "=0.2.122"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 2
