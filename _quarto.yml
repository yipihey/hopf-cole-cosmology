project:
  type: book
  output-dir: _site
  pre-render:
    - scripts/build_info.py
    - scripts/brand_to_css.py
  # Copied verbatim into _site (standalone app, WASM pkg, JS, shaders, CSS).
  resources:
    - app/**
    - api/**
    - notebooks/*.ipynb

book:
  title: "Hopf–Cole Cosmology"
  subtitle: "From Burgers' equation to the cosmic web, in your browser"
  author: "Tom Abel"
  date: today
  site-url: https://yipihey.github.io/hopf-cole-cosmology/
  repo-url: https://github.com/yipihey/hopf-cole-cosmology
  repo-actions: [edit, source, issue]
  repo-branch: main
  search: true
  navbar:
    right:
      - text: "Interactive Lab"
        href: app/index.html
      - icon: github
        href: https://github.com/yipihey/hopf-cole-cosmology
        aria-label: GitHub
  sidebar:
    style: docked
    tools:
      - icon: joystick
        text: "Interactive Lab"
        href: app/index.html
  chapters:
    - index.qmd
    - part: "Burgers, heat and Hopf–Cole"
      chapters:
        - chapters/01-burgers.qmd
        - chapters/02-heat.qmd
        - chapters/03-hopf-cole.qmd
        - chapters/04-two-spaces.qmd
    - part: "Cosmology"
      chapters:
        - chapters/05-zeldovich.qmd
        - chapters/06-lpt.qmd
        - chapters/07-mode-coupling.qmd
    - part: "Laboratory"
      chapters:
        - chapters/08-lab.qmd
        - chapters/09-exercises.qmd
    - chapters/references.qmd
  appendices:
    - chapters/notation.qmd
    - chapters/status.qmd
  page-footer:
    left: "Hopf–Cole Cosmology · MIT License"
    right: "build {{< var build.sha >}} · {{< var build.date >}}"

bibliography: chapters/references.bib

citation:
  type: book
  author: "Tom Abel"
  issued: 2026
  url: https://yipihey.github.io/hopf-cole-cosmology/
  publisher: "GitHub Pages"
appendix-cite-as: [display, bibtex]

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css:
      - app/css/hcc.css
    toc: true
    number-sections: true
    number-depth: 2
    code-fold: true
    code-tools: true
    html-math-method: katex
    include-in-header: includes/head.html
    date-modified: last-modified
    comments:
      hypothesis:
        theme: clean
        openSidebar: false

execute:
  freeze: auto
  echo: true
  warning: false
